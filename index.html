<title>CrashLens</title>
<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
.mono,pre,textarea,code,.lb,.gut{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:6px;padding:6px 10px}
.logo{font-weight:650;letter-spacing:-.01em;white-space:nowrap;display:flex;align-items:center;gap:6px;margin-right:6px}
nav{display:flex;gap:2px;overflow-x:auto;flex:1}
nav button{background:none;border:0;color:var(--mu);padding:0 12px;min-height:40px;border-radius:6px;font:inherit;cursor:pointer;white-space:nowrap}

main{max-width:980px;margin:0 auto;padding:12px 12px 40px}
.pn{background:var(--pn);border:1px solid var(--bd);border-radius:6px;padding:12px 14px;margin:12px 0}
h1{font-size:1.35rem;margin:.2rem 0 .5rem;overflow-wrap:anywhere}h2{font-size:1rem;margin:0 0 8px}p{margin:.4rem 0}
.mu{color:var(--mu);font-size:.9rem}
.btn,select,.in{background:var(--pn);color:var(--tx);border:1px solid var(--bd);border-radius:6px;min-height:40px;padding:0 12px;font:inherit;cursor:pointer}
.btn.pri{background:var(--ac);color:#0b0e12;border-color:var(--ac);font-weight:600}

.hrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.hrow .grow{flex:1;min-width:200px}

@media(max-width:520px){dl{grid-template-columns:1fr}dd{margin-bottom:6px}.logo span{display:none}}

/* ---------- Settings (persisted locally) ---------- */
const S=Object.assign({theme:'system',hist:true,full:false,fs:16,wrap:false,ln:true},store.get('cl:settings',{}));
const saveS=()=>{store.set('cl:settings',S);applyTheme()};
function applyTheme(){const r=document.documentElement;S.theme==='system'?r.removeAttribute('data-theme'):r.dataset.theme=S.theme;r.style.setProperty('--fs',S.fs+'px')}

/* ---------- Analysis engine ----------

 -> match patterns -> evidence lines -> confidence. Fully deterministic; no network. Logs are only ever
 treated as text and rendered with textContent. A future AIAnalyzer would implement the same analyze() contract. */
const ERRL=/^(?:Caused by: |Exception in thread "[^"]*" )?((?:[\w$]+\.)*[A-Z][\w$]*(?:Exception|Error))(?::\s?(.*))?$/;
const F=(t,d,r,w,c)=>({t,d,r,w,c});
const P=[

function parseFrames(lines){const o=[];lines.forEach((l,i)=>{let m;
 if(m=l.match(/^\s*at (?:[\w.]+\/)?([\w.$<>]+)\.([\w$<>]+)\(([^():]+):(\d+)\)/))o.push({language:'Java',className:m[1],function:m[2],file:m[3],line:+m[4],n:i+1});
 else if(m=l.match(/^\s*File "([^"]+)", line (\d+), in (\S+)/))o.push({language:'Python',file:m[1],line:+m[2],function:m[3],n:i+1});
 else if(m=l.match(/^\s*at (?:(.+?) \()?((?:file:\/\/|\/|[A-Za-z]:\\|\.)?[^\s()]+):(\d+):(\d+)\)?$/))o.push({language:'JavaScript',function:m[1],file:m[2],line:+m[3],column:+m[4],n:i+1})});return o}

function classify(text,excs,frames){const names=excs.map(e=>e.name).join(' ');let language='Unknown';
 if(/^(fatal|error): |\[(remote )?rejected\]|CONFLICT \(|Permission denied \(publickey\)|Authentication failed/m.test(text)&&!/Exception|Traceback/.test(text))language='Git';
 else if(/undefined reference to|[Ss]egmentation fault|SIGSEGV|ld returned \d+/.test(text))language='C/C++';
 else if(/Traceback \(most recent call last\)|No module named|\b(ModuleNotFound|Import|Key|Index|Attribute|FileNotFound|Permission|Memory)Error\b/.test(text)&&!/\.java:\d+/.test(text))language='Python';
 else if(frames.some(f=>f.language==='Java')||/\bjava\.[a-z]|\.java:\d+|(Exception|Error)\b.*\bnet\.minecraft|Fabric Loader|Mod resolution failed|Incompatible mods found|mandatory dependencies/.test(text)||/(?:[a-z]+\.)+[A-Z]\w*(Exception|Error)/.test(names))language='Java';
 else if(frames.some(f=>f.language==='JavaScript')||/\b(Type|Reference|Syntax|Range)Error\b|Cannot read propert|ERR_MODULE_NOT_FOUND|Cannot find module|npm ERR!/.test(text))language='JavaScript';
 return language}

function detectEnv(text,lang){const g=r=>{const m=text.match(r);return m?m.slice(1).find(Boolean):null};
 const mc=/minecraft|fabricloader|neoforge|org\.bukkit|io\.papermc/i.test(text);
 const loader=!mc?null:/neoforge/i.test(text)?'NeoForge':/fabric/i.test(text)?'Fabric':/quilt/i.test(text)?'Quilt':/minecraftforge|\bforge\b/i.test(text)?'Forge':/papermc|\bPaper\b/.test(text)?'Paper':/spigot/i.test(text)?'Spigot':/bukkit/i.test(text)?'Bukkit':null;
 const mods=[];for(const m of text.matchAll(/^\t+([a-z][a-z0-9_-]+): .+? (\d[\w.+\-]*)$/gm)){if(mods.length<300)mods.push({id:m[1],version:m[2]})}
 const node=/npm ERR!|node:internal|ERR_MODULE_NOT_FOUND|Cannot find module|ERR_REQUIRE_ESM/.test(text);
 return{mc,loader,mods,node,mcVer:g(/Minecraft Version:\s*(\S+)/)||g(/Minecraft (1\.\d+(?:\.\d+)?)/),loaderVer:g(/Fabric Loader\s+(\d[\w.\-+]*)/)||g(/fabricloader[ -](\d[\w.\-+]*)/i),
  java:g(/Java Version:\s*([\d._]+)/)||g(/(?:openjdk|java) version "([^"]+)"/i)||g(/Java (\d+(?:\.\d+)*)/),os:g(/Operating System:\s*(.+)/)||g(/\bos\.name\W+(.+)/),arch:g(/\((amd64|x86_64|aarch64|arm64|x86)\)/),
  mixins:(text.match(/Mixin apply failed|MixinApplyError|InvalidInjectionException|MixinTransformerError|Critical injection failure/g)||[]).length}}

function suspectMod(text,frames,mods){const ids=new Set(mods.map(m=>m.id));const c=[];
 for(const m of text.matchAll(/([a-z][a-z0-9_-]+)\.mixins?\.json/gi))c.push([m[1].toLowerCase(),'mixin config name']);
 for(const f of frames)for(const seg of (f.className||'').toLowerCase().split('.'))if(ids.has(seg))c.push([seg,'stack frame package']);
 const s=c.find(x=>!/^(fabric|minecraft|java|mixinextras|mixin)/.test(x[0]));return s?{id:s[0],via:s[1],version:(mods.find(m=>m.id===s[0])||{}).version}:null}

/* Confidence: fixed weights, summed from evidence flags (max 100). Same input always gives the same score. */
function score(f){const items=[['Known exception type',25,f.exc],['Matched a specific error pattern',25,f.pat],['Known environment',15,f.env],['Relevant stack frame',15,f.frames],['Known dependency relationship',10,f.dep],['Corroborating evidence (2+ matching lines)',10,f.corr]].map(([label,points,ok])=>({label,points,ok:!!ok}));return{score:items.reduce((a,i)=>a+(i.ok?i.points:0),0),items}}

function analyze(raw){const text=raw.replace(/\r\n?/g,'\n').replace(/\x1b\[[0-9;]*m/g,'');const lines=text.split('\n');
 const excs=[];lines.forEach((l,i)=>{const m=l.trim().match(ERRL);if(m)excs.push({n:i+1,name:m[1],msg:m[2]||'',caused:/^Caused by/.test(l.trim())})});
 const frames=parseFrames(lines),language=classify(text,excs,frames),env=detectEnv(text,language);
